<app-header></app-header>

<section class="main" id="main" #main>

      <div class="mainContainer">
            <div class="fullcontainer">

               <div class="HeroSection"
                    [style.--hero-btn-top]="hero() ? hero()!.buttonTopDesktop + '%' : null"
                    [style.--hero-btn-top-mobile]="hero() ? hero()!.buttonTopMobile + '%' : null">
                  <!-- Hero: managed in /admin/home (API: GET /api/v1/settings) -->
                  <div class="image">
                     @if (hero(); as hero) {
                        @if (hero.video) {
                           <video [src]="hero.video" [attr.poster]="hero.poster || hero.image || null" [attr.aria-label]="hero.alt || null"
                                  muted autoplay loop playsinline preload="auto"></video>
                        } @else {
                           <picture>
                              @if (hero.mobileImage) {
                                 <source media="(max-width: 500px)" [attr.srcset]="hero.mobileImage">
                              }
                              <img [src]="hero.image" [alt]="hero.alt" fetchpriority="high" decoding="async">
                           </picture>
                        }
                     }
                  </div>
                 <div class="text">
                  <button class="btn" routerLink="/works">
                     Works
                  </button>
                 </div>

               </div>

               <!-- Featured tiles: managed in /admin/featured (API: GET /api/v1/projects/featured) -->
               @for (tile of tiles(); track tile.slug; let idx = $index) {
               <div class="project">
                  <a [routerLink]="['/', 'works', tile.slug]" [attr.aria-label]="tile.title">
                     <div class="image">
                        <img [src]="tile.image" [alt]="tile.title" [attr.loading]="idx === 0 ? null : 'lazy'" decoding="async">
                     </div>
                  </a>
                 <div class="text">
                  <h3>{{ tile.title }}</h3>
                 </div>
               </div>
               }
            </div>
      </div>
</section>
