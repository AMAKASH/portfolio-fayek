<app-header></app-header>

<div class="main">
  <div class="mainContainer">
    <div class="fullContainer">
      @if (projects() === null) {
        <p class="state" data-ssr-nocache>Projects couldn't be loaded. Please refresh the page.</p>
      }
      <div class="projects-grid">
        @for (project of projects() ?? []; track project.slug; let idx = $index) {
          <div class="project">
            <a [routerLink]="['/', 'works', project.slug]">
              <img [src]="project.thumbnail" [alt]="project.title" [attr.loading]="idx < 4 ? null : 'lazy'" decoding="async" />
              <h3>{{ project.title }}</h3>
              <p>{{ project.description }}</p>
            </a>
          </div>
        }
      </div>
    </div>
  </div>
</div>
